[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "threatprophet-reposcan"
version = "0.3.1"
description = "Static review of unfamiliar repositories before trusting, installing, or running them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "jsonschema>=4.23,<5",
  "build>=1.2,<2",
  "pipx>=1.7,<2",
]
yara = [
  "yara-python>=4.5,<5",
]

[project.scripts]
reposcan = "reposcan.cli:main"

[project.urls]
Repository = "https://github.com/ThreatProphet/RepoScan"
Research = "https://threatprophet.com/"
Issues = "https://github.com/ThreatProphet/RepoScan/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["reposcan*"]
namespaces = false

[tool.setuptools.package-data]
reposcan = ["rules/*.yar", "config/*.txt", "schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "canonical: requires at least one canonical YARA engine",
  "parity: requires both yara-python and the YARA CLI",
  "posix: requires POSIX filesystem primitives",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
