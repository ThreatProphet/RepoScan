[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcan"
version = "0.1.0"
description = "Deterministic YARA-based triage for untrusted developer-task repositories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]
yara = [
  "yara-python>=4.5,<5",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "canonical: requires at least one canonical YARA engine",
  "parity: requires both yara-python and the YARA CLI",
  "posix: requires POSIX filesystem primitives",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
