name: Warning feedback or false positive
description: Help make a warning more accurate, proportionate, or useful.
title: "[Warning]: "
body:
  - type: markdown
    attributes:
      value: |
        A benign project can still contain a useful review signal. Tell us whether the match, explanation, severity, or confidence needs improvement.

        A full repository or report is not required. Keep examples inert and omit credentials, personal data, and private source. For vulnerabilities in RepoScan itself, follow [SECURITY.md](https://github.com/ThreatProphet/RepoScan/blob/HEAD/SECURITY.md).
  - type: textarea
    id: finding
    attributes:
      label: Finding and scan context
      description: Include exact rule IDs, severity and confidence, RepoScan version, and engine if known. Share only the relevant sanitized output.
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: What does the finding get wrong?
      description: Explain the legitimate behavior or the claim that exceeds the evidence. A warning can remain appropriate even when the code is benign.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Inert example or public reference
      description: Optional reduced example or public source. Identify whether the example is original, decoded, reconstructed, or synthetic.
    validations:
      required: false
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: Optional wording, severity or confidence adjustment, or a more precise matching condition. It is fine to be unsure of the fix.
    validations:
      required: false
