name: Prepare release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate tag, versions, main ancestry, and changelog
        id: prepare
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_dir="$RUNNER_TEMP/reposcan-release"
          printf 'RELEASE_DIR=%s\n' "$release_dir" >> "$GITHUB_ENV"
          python tools/prepare_release.py "$RELEASE_TAG" \
            --output-directory "$release_dir" >> "$GITHUB_OUTPUT"
      - name: Build release distributions
        run: |
          python -m pip install 'build>=1.2,<2' 'pipx>=1.7,<2'
          python -m build --outdir "$RELEASE_DIR"
      - name: Verify the exact release wheel
        env:
          RELEASE_WHEEL: ${{ steps.prepare.outputs.wheel }}
        run: |
          python tools/verify_wheel.py "$RELEASE_DIR/$RELEASE_WHEEL"
          python tools/verify_install.py "$RELEASE_DIR/$RELEASE_WHEEL"
      - name: Bind the launcher to the exact release wheel
        env:
          RELEASE_WHEEL: ${{ steps.prepare.outputs.wheel }}
        run: |
          python tools/prepare_launcher.py "$RELEASE_DIR/$RELEASE_WHEEL" \
            --output "$RELEASE_DIR/reposcan-run.sh"
      - name: Create distribution checksums
        env:
          RELEASE_WHEEL: ${{ steps.prepare.outputs.wheel }}
          RELEASE_SDIST: ${{ steps.prepare.outputs.sdist }}
        run: |
          cd "$RELEASE_DIR"
          sha256sum "$RELEASE_WHEEL" "$RELEASE_SDIST" reposcan-run.sh > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: reposcan-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_DIR }}/
          if-no-files-found: error
          retention-days: 14

  qualify-launcher:
    needs: package
    name: Release launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: release
      - name: Verify uploaded launcher and wheel on the native platform
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            (cd release && shasum -a 256 --check SHA256SUMS)
          else
            (cd release && sha256sum --check SHA256SUMS)
          fi
          wheels=(release/*.whl)
          [[ "${#wheels[@]}" -eq 1 && -f "${wheels[0]}" ]]
          python tools/verify_launcher.py --launcher release/reposcan-run.sh \
            --wheel "${wheels[0]}"

  draft:
    needs: [package, qualify-launcher]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: release
      - name: Create draft release with verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_TAG" == "v$RELEASE_VERSION" ]]

          # Resolve the current remote tag again before creating the draft.
          read -r object_type object_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object | "\(.type) \(.sha)"'
          )
          if [[ "$object_type" == "tag" ]]; then
            read -r object_type object_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                --jq '.object | "\(.type) \(.sha)"'
            )
          fi
          [[ "$object_type" == "commit" && "$object_sha" == "$RELEASE_COMMIT" ]]

          cd release
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" \
            "threatprophet_reposcan-${RELEASE_VERSION}-py3-none-any.whl" \
            "threatprophet_reposcan-${RELEASE_VERSION}.tar.gz" \
            reposcan-run.sh \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "RepoScan $RELEASE_TAG" \
            --notes-file release-notes.md
