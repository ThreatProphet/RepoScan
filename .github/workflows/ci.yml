name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.12"
          - os: macos-15
            python: "3.12"
          - os: macos-15-intel
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux verification tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck yara
      - name: Install macOS verification tools
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install shellcheck yara
      - name: Install Python verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=yara-python --editable '.[dev,yara]'
      - name: Python static checks
        run: |
          ruff check src tools tests
          python -m compileall -q src tools
      - name: Bash lint
        run: shellcheck tools/scan_task.sh install.sh reposcan-run.sh
      - name: Compile YARA rules
        run: yara -w src/reposcan/rules/*.yar /dev/null
      - name: Test
        run: pytest
      - name: Build distributions
        run: python -m build
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          wheels=(dist/*.whl)
          [[ "${#wheels[@]}" -eq 1 && -f "${wheels[0]}" ]]
          python tools/verify_wheel.py "${wheels[0]}"
      - name: Verify fresh pipx installation and native scans
        shell: bash
        run: |
          wheels=(dist/*.whl)
          [[ "${#wheels[@]}" -eq 1 && -f "${wheels[0]}" ]]
          python tools/verify_install.py "${wheels[0]}"
      - name: Verify quick-run launcher with the exact wheel
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          wheels=(dist/*.whl)
          [[ "${#wheels[@]}" -eq 1 && -f "${wheels[0]}" ]]
          python tools/prepare_launcher.py "${wheels[0]}" --output "$RUNNER_TEMP/reposcan-run.sh"
          python tools/verify_launcher.py --launcher "$RUNNER_TEMP/reposcan-run.sh" --wheel "${wheels[0]}"
      - name: Verify source launcher downloads its published wheel
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: python tools/verify_launcher.py
      - name: Verify convenience installer outside checkout
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          install_test_dir=$(mktemp -d)
          # Resolve only this owned directory, including macOS temporary aliases.
          install_test_dir=$(cd "$install_test_dir" && pwd -P)
          trap 'rm -rf "$install_test_dir"' EXIT
          install_test_python=$(command -v python)
          PATH=/usr/bin:/bin ./install.sh --python "$install_test_python" \
            --prefix "$install_test_dir/application" --bin-dir "$install_test_dir/bin"
          "$install_test_dir/bin/reposcan" --version
