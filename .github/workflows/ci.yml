name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck yara
          python -m pip install --upgrade pip
          python -m pip install --editable '.[dev,yara]'
      - name: Python static checks
        run: |
          ruff check src tools tests
          python -m compileall -q src tools
      - name: Bash lint
        run: shellcheck tools/scan_task.sh install.sh
      - name: Compile YARA rules
        run: yara -w src/reposcan/rules/*.yar /dev/null
      - name: Test
        run: pytest
      - name: Build distributions
        run: python -m build
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          wheels=(dist/*.whl)
          [[ "${#wheels[@]}" -eq 1 && -f "${wheels[0]}" ]]
          python tools/verify_wheel.py "${wheels[0]}"
      - name: Verify fresh pipx installation and native scans
        shell: bash
        run: |
          wheels=(dist/*.whl)
          [[ "${#wheels[@]}" -eq 1 && -f "${wheels[0]}" ]]
          python tools/verify_install.py "${wheels[0]}"
      - name: Verify convenience installer outside checkout
        run: |
          install_test_dir=$(mktemp -d)
          trap 'rm -rf "$install_test_dir"' EXIT
          install_test_python=$(command -v python)
          PATH=/usr/bin:/bin ./install.sh --python "$install_test_python" \
            --prefix "$install_test_dir/application" --bin-dir "$install_test_dir/bin"
          "$install_test_dir/bin/reposcan" --version
