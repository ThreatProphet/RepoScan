name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck yara
          python -m pip install --upgrade pip
          python -m pip install --editable '.[dev,yara]'
      - name: Python static checks
        run: |
          ruff check src tools tests
          python -m compileall -q src tools
      - name: Bash lint
        run: shellcheck tools/scan_task.sh
      - name: Compile YARA rules
        run: yara -w src/reposcan/rules/*.yar /dev/null
      - name: Test
        run: pytest
      - name: Build distributions
        run: python -m build
      - name: Verify installed wheel outside checkout
        run: python tools/verify_wheel.py dist/reposcan-0.2.0-py3-none-any.whl
